name: Feature or component request
description: Suggest a new component or enhancement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed usage
      description: How would you like to write the component in Blade?
      render: blade
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
