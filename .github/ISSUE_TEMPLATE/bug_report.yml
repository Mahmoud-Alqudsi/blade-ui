name: Bug report
description: Report unexpected behavior in a component
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Blade code to reproduce
      description: Minimal example reproducing the issue.
      render: blade
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Laravel / PHP / Tailwind / Alpine / package
      placeholder: "Laravel 13.x, PHP 8.4, Tailwind 4.3, Alpine 3.x, blade-ui 1.1.0"
    validations:
      required: true
  - type: dropdown
    id: dir
    attributes:
      label: Text direction
      options: [RTL, LTR, Both]
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      options: [Light, Dark, Both]
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: I ran `blade-ui:install` and verified that `@alpinejs/focus` is registered
