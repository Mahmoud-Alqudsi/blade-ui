name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        merge: ['with-tailwind-merge', 'without-tailwind-merge']

    name: PHP ${{ matrix.php }} (${{ matrix.merge }})

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Remove the optional merge package
        if: matrix.merge == 'without-tailwind-merge'
        run: composer remove stamat/tailwind-merge-php --dev --no-update

      - run: composer update --prefer-dist --no-interaction --no-progress

      - run: vendor/bin/pest
